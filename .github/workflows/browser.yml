name: Browser smoke — Bayterek
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify 3D render and map
        run: node tests/browser-smoke.mjs
      - name: Screenshot of Bayterek stage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baiterek-v1-preview
          path: artifacts/
          if-no-files-found: ignore
